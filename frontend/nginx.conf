server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Enrutamiento principal de React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el Backend PHP
    location /api {
        # El nombre del host coincidirá con el alias en docker-compose
        proxy_pass http://backend_php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso hacia archivos estáticos del Backend (fotos de candidatos, etc.)
    location /static {
        proxy_pass http://backend_php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

